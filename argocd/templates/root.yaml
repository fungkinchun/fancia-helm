apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - {{ include "argocd.finalizer" . }}
spec:
  project: default
  source:
    repoURL: {{ required "helmRepoUrl is required" .Values.helmRepoUrl | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: argocd
    helm:
      valueFiles:
        - values.yaml
        - {{ include "argocd.dynamicValuesFile" . }}
  destination:
    server: {{ .Values.clusterServer | quote }}
    namespace: argocd
  syncPolicy:
    {{ include "argocd.automatedSyncPolicy" . | nindent 4 }}

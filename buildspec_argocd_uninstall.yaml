version: 0.2

phases:
  install:
    commands:
      - |
        if [ "$USE_EKS" = "false" ]; then
          echo "USE_EKS=false detected. Skipping ArgoCD uninstall."
          exit 0
        fi
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/kubectl
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  pre_build:
    commands:
      - |
        if [ "$USE_EKS" = "false" ]; then
          echo "USE_EKS=false detected. Skipping ArgoCD uninstall."
          exit 0
        fi
        aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" || true
  build:
    commands:
      - |
        if [ "$USE_EKS" = "false" ]; then
          echo "USE_EKS=false detected. Skipping ArgoCD uninstall."
          exit 0
        fi

        kubectl delete application root -n argocd --ignore-not-found=true --wait=true || true
        kubectl delete applications --all -n argocd --ignore-not-found=true --wait=true || true
        kubectl delete appprojects platform apps -n argocd --ignore-not-found=true || true
        helm uninstall argocd -n argocd || true

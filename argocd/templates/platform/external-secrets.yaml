apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - {{ include "argocd.finalizer" . }}
spec:
  project: platform
  source:
    repoURL: {{ .Values.charts.externalSecrets.repo | quote }}
    chart: {{ .Values.charts.externalSecrets.name | quote }}
    targetRevision: {{ .Values.charts.externalSecrets.version | quote }}
    helm:
      values: |
        installCRDs: true
  destination:
    server: {{ .Values.clusterServer | quote }}
    namespace: external-secrets
  syncPolicy:
    {{ include "argocd.automatedSyncPolicy" . | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

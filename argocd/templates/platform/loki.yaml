apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - {{ include "argocd.finalizer" . }}
spec:
  project: platform
  sources:
    - repoURL: {{ required "helmRepoUrl is required" .Values.helmRepoUrl | quote }}
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values
    - repoURL: {{ .Values.charts.loki.repo | quote }}
      chart: {{ .Values.charts.loki.name | quote }}
      targetRevision: {{ .Values.charts.loki.version | quote }}
      helm:
        valueFiles:
          - $values/platform-values/loki/values.yaml
          - $values/platform-values/loki/{{ include "argocd.dynamicValuesFile" . }}
          - $values/main-chart/loki-values.yaml
  destination:
    server: {{ .Values.clusterServer | quote }}
    namespace: monitoring
  syncPolicy:
    {{ include "argocd.automatedSyncPolicy" . | nindent 4 }}
    syncOptions:
      - ServerSideApply=true
